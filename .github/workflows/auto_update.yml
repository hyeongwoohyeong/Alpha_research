name: 포트폴리오 자동 업데이트 (3시간마다)

on:
  schedule:
    # KST 기준 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00
    # (UTC 기준 -9h)
    - cron: "0 */3 * * *"
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests

      - name: 포트폴리오 업데이트
        env:
          TOSS_APP_KEY:    ${{ secrets.TOSS_APP_KEY }}
          TOSS_APP_SECRET: ${{ secrets.TOSS_APP_SECRET }}
        run: python scripts/sync_toss.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wealth_dashboard.json
          # 변경사항 있을 때만 커밋
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 스킵"
          else
            TIMESTAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "auto: 포트폴리오 업데이트 ${TIMESTAMP}"
            git push
          fi
